<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia: Educación en Corea del Sur</title>
<style>
:root{--bg:#141414;--fg:#fff;--mut:#b3b3b3;--panel:#1f1f1f;--red:#e50914;--ok:#1f8a4c;--bad:#b3261e;--line:#333;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#fff;--mut:#b3b3b3;--panel:#1f1f1f;--line:#333}}
:root[data-theme="dark"]{--bg:#141414;--fg:#fff;--mut:#b3b3b3;--panel:#1f1f1f;--line:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100vh}
.wrap{max-width:40rem;margin:0 auto;padding:1rem 1.2rem 2.5rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.9rem;color:var(--mut)}
.brand{color:var(--red);font-weight:900;letter-spacing:.12em}
.top b{color:var(--fg)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:.8rem 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--red)}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin:.5rem 0}
.q{font-size:clamp(1.25rem,4.8vw,1.7rem);font-weight:700;line-height:1.3;margin:1rem 0 1.2rem}
.opt{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;background:var(--panel);color:var(--fg);border:2px solid transparent;border-radius:8px;padding:.9rem 1rem;font:inherit;font-size:1.05rem;margin:.55rem 0;cursor:pointer}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--red);outline:none}
.opt kbd{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:#000;display:grid;place-items:center;font:700 .85rem Arial,sans-serif;color:var(--mut)}
.opt.ok{background:var(--ok)}.opt.bad{background:var(--bad)}.opt:disabled{cursor:default}
.opt.ok kbd,.opt.bad kbd{background:#0006;color:#fff}
.fb{background:var(--panel);border-radius:8px;padding:1rem 1.1rem;margin-top:1rem;line-height:1.5}
.fb h3{margin:0 0 .4rem;font-size:1.1rem}.fb p{margin:0;color:#d2d2d2}.fb small{display:block;margin-top:.5rem;color:var(--mut)}
.btn{border:0;border-radius:6px;padding:.85rem 1.6rem;font-family:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;background:var(--red);color:#fff;margin-top:1rem}
.btn:hover{opacity:.85}.btn.alt{background:#333}
.hero{text-align:center;padding:2.5rem 0 1rem}
.hero h1{font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.1;margin:.5rem 0}
.hero p{color:#d2d2d2;line-height:1.5}
.big{font-size:4rem;font-weight:900;color:var(--red);line-height:1}
.stats{display:flex;gap:.8rem;margin:1.2rem 0}.stat{flex:1;background:var(--panel);border-radius:8px;padding:.8rem;text-align:center}
.stat b{display:block;font-size:1.5rem}.stat span{font-size:.8rem;color:var(--mut)}
.rev{background:var(--panel);border-radius:8px;padding:.8rem 1rem;margin:.6rem 0;text-align:left;line-height:1.45}
.rev b{display:block;margin-bottom:.2rem}.rev span{color:#7ee0a2}.rev small{color:var(--mut)}
.in{width:100%;padding:.8rem 1rem;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--fg);font-family:inherit;font-size:1.05rem;margin:.6rem 0}.in:focus{outline:none;border-color:var(--red)}.rk{background:var(--panel);border-radius:8px;padding:.6rem 1rem;margin:.8rem 0;text-align:left}.rk div{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const P=[
{q:"¿Qué significa Hongik Ingan, el principio que guía la educación coreana?",o:["Beneficiar a toda la humanidad","Respetar siempre a los mayores","Alcanzar la excelencia individual","Vivir en armonía con la naturaleza"],e:"Es el principio de la finalidad educativa: formar ciudadanos autónomos, creativos y comprometidos con su comunidad.",c:"Cap. 3"},
{q:"¿Cómo se llama el examen de acceso a la universidad más importante?",o:["Suneung","Hagwon","Hongik","Gaokao"],e:"El Suneung, además, funciona como filtro de selección social.",c:"Cap. 11"},
{q:"¿Qué son los hagwons?",o:["Academias privadas a las que se asiste después de clases","Escuelas públicas gratuitas","Universidades nacionales","Plataformas de televisión educativa"],e:"Son las academias privadas (y las tutorías) que forman la educación suplementaria.",c:"Cap. 12"},
{q:"En el esquema 6-3-3-4, ¿cuántos años dura la primaria?",o:["6","3","4","9"],e:"Primaria 6 años, secundaria baja 3, secundaria alta 3 y universidad 4.",c:"Cap. 5"},
{q:"¿Hasta qué nivel es obligatoria la educación?",o:["Hasta la secundaria baja","Solo la primaria","Hasta la universidad","Hasta la secundaria alta"],e:"Primaria y secundaria baja son obligatorias.",c:"Cap. 5"},
{q:"¿En qué mes inicia el año escolar?",o:["Marzo","Enero","Septiembre","Julio"],e:"El año inicia en marzo y se divide en dos semestres.",c:"Cap. 5"},
{q:"¿Por qué Mark Bray la llama educación \"en la sombra\"?",o:["Porque existe junto a la escuela formal y sigue sus mismos contenidos","Porque se imparte de noche","Porque está prohibida","Porque la ofrece el gobierno en secreto"],e:"Crece en paralelo al sistema formal y copia su currículo.",c:"Cap. 12"},
{q:"Según Bray, ¿cuál es la causa principal de los hagwons?",o:["La competencia social","Las fallas de la escuela pública","La falta de maestros","La mala infraestructura"],e:"Responden sobre todo a la competencia social, no solo a fallas de la escuela pública.",c:"Cap. 12"},
{q:"¿Dónde surge la principal desigualdad según Bray?",o:["En el acceso a las mejores academias privadas","En el costo de la escuela pública","En los libros de texto","En el calendario escolar"],e:"El acceso depende de la capacidad económica de cada familia.",c:"Cap. 12"},
{q:"¿Cómo se llama el currículo vigente, aplicado de forma gradual desde 2024?",o:["Currículo Revisado 2022","Currículo Hallyu 2000","Currículo Digital 2030","Currículo Hongik 1997"],e:"Busca menos memorización y más creatividad, autonomía y alfabetización digital.",c:"Cap. 6"},
{q:"Tras terminar la carrera de educación primaria, ¿qué se necesita para obtener plaza fija en una escuela pública?",o:["Aprobar el examen de oposición (Teacher Recruitment Examination)","Solo presentar el título","Pagar una cuota a la escuela","Ser nominado por el Ministerio"],e:"Es un examen muy competitivo que organiza cada oficina de educación local.",c:"Cap. 8"},
{q:"Hoy, los libros de texto digitales con IA se consideran…",o:["Materiales educativos complementarios","Los únicos libros oficiales","Libros prohibidos","Libros solo para la universidad"],e:"Fueron reclasificados como materiales complementarios, no libros de texto oficiales.",c:"Cap. 7"},
{q:"¿Cuál fue la tasa de fecundidad de Corea del Sur en 2024?",o:["0,72 hijos por mujer","2,1 hijos por mujer","1,5 hijos por mujer","3,2 hijos por mujer"],e:"Está muy por debajo del nivel de reemplazo (2,1). En junio de 2026 subió a 0,88.",c:"Cap. 13"},
{q:"¿Con qué país tiene Corea del Sur su única frontera terrestre?",o:["Corea del Norte","China","Japón","Rusia"],e:"China y Japón quedan al otro lado del mar.",c:"Cap. 2"},
{q:"¿Cuál es el punto más alto de Corea del Sur?",o:["Hallasan (1 947 m), en la isla de Jeju","Monte Fuji","Torre de Seúl","Río Han"],e:"Cerca del 70 % del territorio es montañoso.",c:"Cap. 2"},
{q:"¿Qué plataformas públicas gratuitas ofrece el gobierno coreano?",o:["EBS y EDUNET","Netflix y YouTube","Duolingo y Coursera","Kahoot y Moodle"],e:"Junto con los límites de horario a las academias, buscan reducir la desigualdad.",c:"Cap. 14"}
];
// Pega aquí la URL de tu Apps Script (termina en /exec). Si queda vacía, el juego funciona en modo práctica.
const SCORE_URL="https://script.google.com/macros/s/AKfycbztNR5bgTPFHvmD2wMVo3Fiytcc7qPqOhqCbxqGEORnr0fPon6-cax5FRp5bCxN54y0/exec";
const N=10,TL=20,app=document.getElementById("app");
let G=null,timer=null,PLAYER="";
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const best=()=>{try{return +localStorage.getItem("coreaBest")||0}catch(e){return 0}};
const saveBest=s=>{try{localStorage.setItem("coreaBest",String(s))}catch(e){}};
function home(){
  G=null;clearInterval(timer);
  let nm="";try{nm=localStorage.getItem("coreaName")||""}catch(e){}
  app.innerHTML=`<div class="hero"><div class="brand">COREA·EDU</div><h1>Trivia: ¿qué aprendimos de la educación en Corea del Sur?</h1><p>${N} preguntas · ${TL} segundos cada una · ganas más puntos si respondes rápido.</p><input class="in" id="nm" maxlength="30" placeholder="Escribe tu nombre completo" autocomplete="name" value="${nm.replace(/["<>]/g,"")}"><p style="font-size:.85rem;color:var(--mut);margin:.2rem 0">Tu resultado se envía al profesor. Solo cuenta tu primer intento con tu nombre.</p><div id="er" style="color:#ff8a80;min-height:1.3rem"></div><button class="btn" id="go">▶ Jugar</button><button class="btn alt" id="rk" style="margin-left:.5rem">🏆 Ranking</button><div id="rkb"></div></div>`;
  document.getElementById("go").onclick=()=>{const v=document.getElementById("nm").value.trim();if(v.length<3){document.getElementById("er").textContent="Escribe tu nombre (mínimo 3 letras).";return}PLAYER=v;try{localStorage.setItem("coreaName",v)}catch(e){}start()};
  document.getElementById("rk").onclick=ranking;
}
async function send(){
  const el=document.getElementById("snd");
  if(!SCORE_URL){el.textContent="Modo práctica: este resultado no se registra.";return}
  el.textContent="Enviando resultado…";
  try{
    await fetch(SCORE_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:PLAYER,score:G.s,ok:G.ok,n:N})});
    el.textContent="✅ Resultado enviado a tu profesor. Solo cuenta tu primer intento.";
  }catch(e){
    el.innerHTML='⚠ No se pudo enviar. <button class="btn alt" id="rt" style="margin:0 0 0 .5rem;padding:.4rem .8rem;font-size:.9rem">Reintentar</button>';
    document.getElementById("rt").onclick=send;
  }
}
async function ranking(){
  const b=document.getElementById("rkb"),m=s=>`<p style="color:var(--mut)">${s}</p>`;
  if(!SCORE_URL){b.innerHTML=m("Ranking no disponible en modo práctica.");return}
  b.innerHTML=m("Cargando…");
  try{
    const j=await (await fetch(SCORE_URL)).json();
    b.innerHTML=j.top&&j.top.length?'<div class="rk">'+j.top.map((x,i)=>`<div><span>${i+1}. ${String(x.name).replace(/[<>&"]/g,"")}</span><b>${x.score}</b></div>`).join("")+"</div>":m("Aún no hay resultados.");
  }catch(e){b.innerHTML=m("No se pudo cargar el ranking.")}
}
function start(){
  G={qs:sh(P).slice(0,N).map(x=>({...x,opts:sh(x.o),a:x.o[0]})),i:0,s:0,ok:0,miss:[],st:0,done:false};
  ask();
}
function ask(){
  clearInterval(timer);
  const q=G.qs[G.i];G.done=false;G.t0=performance.now();
  app.innerHTML=`<div class="top"><span class="brand">COREA·EDU</span><span>Puntos: <b id="sc">${G.s}</b></span></div>
  <div class="bar"><i id="tb"></i></div>
  <div class="meta"><span>Pregunta ${G.i+1} de ${N}</span><span id="st">${G.st>1?"🔥 Racha x"+G.st:""}</span></div>
  <div class="q">${q.q}</div>
  <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${o}</span></button>`).join("")}</div>
  <div id="fb" aria-live="polite"></div>`;
  timer=setInterval(()=>{
    const left=TL-(performance.now()-G.t0)/1000;
    document.getElementById("tb").style.width=Math.max(0,left/TL*100)+"%";
    if(left<=0)pick(-1);
  },100);
}
function pick(k){
  if(!G||G.done)return;
  G.done=true;clearInterval(timer);
  const q=G.qs[G.i],left=Math.max(0,TL-(performance.now()-G.t0)/1000),right=k>=0&&q.opts[k]===q.a;
  let pts=0;
  if(right){pts=100+Math.round(left/TL*50)+Math.min(G.st,5)*10;G.s+=pts;G.ok++;G.st++}else{G.st=0;G.miss.push(q)}
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  document.getElementById("sc").textContent=G.s;
  const head=right?`✅ ¡Correcto! +${pts} puntos`:(k<0?"⏱ Se acabó el tiempo":"❌ Incorrecto");
  const last=G.i===N-1;
  document.getElementById("fb").innerHTML=`<div class="fb"><h3>${head}</h3><p>${right?"":"Respuesta correcta: <b>"+q.a+"</b>. "}${q.e}</p><small>Ver en la presentación: ${q.c}</small></div><button class="btn" id="nx">${last?"Ver resultado":"Siguiente ›"}</button>`;
  document.getElementById("nx").onclick=next;document.getElementById("nx").focus();
}
function next(){G.i++;G.i>=N?end():ask()}
function end(){
  const prev=best();if(G.s>prev)saveBest(G.s);
  const r=G.ok/N,tier=r>=.9?["🏆","¡Experto/a en educación coreana!"]:r>=.7?["🎓","¡Muy bien! Dominas el tema."]:r>=.5?["📘","Vas bien, repasa algunos capítulos."]:["🔁","Vale la pena repasar la presentación."];
  const rev=G.miss.length?`<h3 style="text-align:left">Para repasar</h3>`+G.miss.map(q=>`<div class="rev"><b>${q.q}</b><span>${q.a}</span><br><small>${q.c}</small></div>`).join(""):`<p>¡Sin errores!</p>`;
  app.innerHTML=`<div class="hero"><div style="font-size:3rem">${tier[0]}</div><h1>${tier[1]}</h1><div class="big">${G.s}</div><p>puntos${G.s>prev?" · ¡nuevo récord!":""}</p>
  <div class="stats"><div class="stat"><b>${G.ok}/${N}</b><span>correctas</span></div><div class="stat"><b>${best()}</b><span>mejor puntaje</span></div></div>
  <p id="snd" style="color:var(--mut)"></p>${rev}<button class="btn" id="again">↻ Jugar de nuevo</button></div>`;
  document.getElementById("again").onclick=home;send();
}
app.addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.k)});
document.addEventListener("keydown",e=>{
  if(!G)return;
  if(!G.done&&/^[1-4]$/.test(e.key))pick(+e.key-1);
  else if(G.done&&G.i<N&&(e.key==="Enter"||e.key===" ")&&document.getElementById("nx")){e.preventDefault();next()}
});
home();
</script>
</body>
</html>
